<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerdEX - Inventory</title>
    <link rel="stylesheet" href="welcome.css">
    <link rel="stylesheet" href="inventory.css">
</head>

<body>

<div class="sidebar">

    <div class="logo">
        <img src="verdexlogo.png" alt="VerdEX Logo">
    </div>

    <button class="sidebar-toggle" onclick="toggleSidebar()">‹</button>

    <a href="home.html">Home</a>
    <a href="inventory.html" class="active">Inventory</a>
    <a href="notification.html">Notifications</a>
    <a href="sales.html">Sales</a>
    <a href="status.html">Status</a>
    <a href="trends.html">Trends</a>
    <a href="reports.html">Weekly Reports</a>

    <h4>About Profile</h4>

    <a href="profile.html">My Profile</a>
    <a href="settings.html">Settings</a>
    <a href="logout.html">Logout</a>

</div>

<main class="content">

    <div class="inventory-header">

        <div>
            <h1>Farm Inventory</h1>
            <p>Manage your hydroponic plants, fertilizers, and tools.</p>
        </div>

        <button class="add-button" onclick="openAddModal()">
            + Add Item
        </button>

    </div>

    <div class="inventory-controls">

        <div class="category-buttons">

            <button
                class="category-button active"
                onclick="showCategory('plant', this)">
                Plants
            </button>

            <button
                class="category-button"
                onclick="showCategory('fertilizer', this)">
                Fertilizers
            </button>

            <button
                class="category-button"
                onclick="showCategory('tool', this)">
                Tools
            </button>

        </div>

        <select id="sortSelect" onchange="sortItems()">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="nameAsc">Name A-Z</option>
            <option value="nameDesc">Name Z-A</option>
            <option value="stockAsc">Stock Low-High</option>
            <option value="stockDesc">Stock High-Low</option>
        </select>

    </div>

    <div id="inventoryContainer" class="inventory-grid"></div>

    <div id="emptyMessage" class="empty-message">
        No inventory items yet.
    </div>

</main>

<div id="addModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>Add Item</h2>
            <button onclick="closeAddModal()">×</button>
        </div>

        <form id="addForm">

            <label>Type</label>

            <select
                id="itemType"
                name="item_type"
                onchange="loadCatalogOptions()"
                required>

                <option value="plant">Hydroponic Plant</option>
                <option value="fertilizer">Fertilizer</option>
                <option value="tool">Tool</option>

            </select>

            <label id="itemLabel">Plant</label>

            <select
                id="catalogId"
                name="catalog_id"
                onchange="showSelectedInformation()"
                required>

                <option value="">Select an item</option>

            </select>

            <div id="autoInfo" class="auto-info">

                <div class="auto-info-title">
                    Recommendation
                </div>

                <div id="autoInfoContent">
                    Select an item to view its recommendation.
                </div>

            </div>

            <label>Picture</label>

            <input
                type="file"
                name="image"
                accept="image/png,image/jpeg,image/webp">

            <label>Initial Stock</label>

            <input
                type="number"
                name="stock"
                min="0"
                value="0"
                required>

            <label>Unit</label>

            <input
                type="text"
                name="unit"
                value="pcs"
                maxlength="30"
                placeholder="pcs">

            <label>Notes</label>

            <textarea
                name="notes"
                placeholder="Add notes..."></textarea>

            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-button"
                    onclick="closeAddModal()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-button"
                    id="addSubmitButton">
                    Add Item
                </button>

            </div>

        </form>

    </div>

</div>

<div id="infoModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="infoTitle"></h2>

            <button onclick="closeInfo()">×</button>

        </div>

        <div id="infoContent"></div>

    </div>

</div>

<div id="notesModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Notes</h2>

            <button onclick="closeNotes()">×</button>

        </div>

        <textarea
            id="notesInput"
            class="notes-input"
            placeholder="Write notes..."></textarea>

        <button
            class="save-button"
            onclick="saveNotes()">
            Save
        </button>

    </div>

</div>

<script src="inventory.js"></script>

</body>
</html>
