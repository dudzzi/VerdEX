<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerdEX - Login</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">

  <div class="login-panel glass-panel">
    <div class="logo-wrapper">
      <img src="../images/verdexlogo.png" alt="VerdEX Logo" class="logo-img">
    </div>

    <h2>Welcome Back</h2>
    <p class="subtitle">Please enter your credentials to log in.</p>

    <form action="home.html" method="POST" class="login-form">
      <div class="input-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <div class="form-actions">
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary btn-full">Log In</button>
    </form>
  </div>

</body>
</html>
