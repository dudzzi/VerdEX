<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Login</title>

  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0c1e15;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Card Container */
    .login-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    /* Logo Styling */
    .logo-wrapper {
      margin-bottom: 1px;
    }

    .logo {
      max-width: 180px;
      height: auto;
      object-fit: contain;
    }

    /* Typography */
    h2 {
      color: #1a1a1a;
      font-size: 24px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #666666;
      font-size: 14px;
      margin-bottom: 28px;
    }

    /* Form Layout */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .input-group {
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333333;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }

    .input-group input:focus {
      border-color: #0066cc;
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
    }

    /* Checkbox & Forgot Password */
    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #555555;
      cursor: pointer;
    }

    .forgot-password {
      color: #0066cc;
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    /* Button Styling */
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #0c1e15;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background-color: #0052a3;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo-wrapper">
      <img src="../images/verdexlogo.png" alt="System Logo" class="logo">
    </div>
    
    <h2>Welcome Back</h2>
    <p class="subtitle">Please enter your credentials to log in.</p>

    <form action="home.html" method="POST" class="login-form">
      <div class="input-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>

      /*di pa tapos*/
      <div class="form-actions">
        <a href="()" class="forgot-password">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit">Log In</button>
    </form>
  </div>

</body>
</html>
