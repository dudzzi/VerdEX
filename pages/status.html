<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerdEX - Status</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="sidebar">

        <div class="logo">
            <img src="../images/verdexlogo.png" alt="VerdEX Logo">
        </div>

        <button class="sidebar-toggle" onclick="toggleSidebar()">‹</button>

        <a href="home.php">Home</a>
        <a href="inventory.html">Inventory</a>
        <a href="calendar.html">Calendar</a>
        <a href="sales.html">Sales</a>
        <a href="status.html" class="active">Status</a>
        <a href="trends.html">Forum</a>
        <a href="reports.html">Weekly Reports</a>

        <h4>About Profile</h4>
        <a href="profile.html">My Profile</a>
        <a href="settings.html">Settings</a>
        <a href="logout.html">Logout</a>
    </div>

    <div class="content">

        <div class="page-heading">
            <span class="eyebrow">Live Monitoring</span>
            <h1>Live Farm Status</h1>
            <p class="page-heading-sub">Real-time readings from your hydroponic sensors.</p>
        </div>

        <div class="status-grid">

            <div class="glass-panel status-card">
                <span class="status-card-label">Temperature</span>
                <div class="status-value" id="temperature">Loading...</div>
            </div>

            <div class="glass-panel status-card">
                <span class="status-card-label">Humidity</span>
                <div class="status-value" id="humidity">Loading...</div>
            </div>

            <div class="glass-panel status-card status-card-warning">
                <span class="status-card-label">Water Moisture</span>
                <div class="status-value" id="water-moisture">Loading...</div>
            </div>

            <div class="glass-panel status-card">
                <span class="status-card-label">Notifications</span>
                <div class="status-value" id="notification-status">None</div>
            </div>

        </div>

    </div>

    <script src="../js/sidebar.js"></script>
    <script>
        async function loadSensor() {
            try {
                const response = await fetch("../sensor/sensor.json?" + Date.now());

                if (!response.ok) {
                    throw new Error("Unable to load sensor.json");
                }

                const data = await response.json();

                document.getElementById("temperature").textContent =
                    data.temperature + " °C";

                document.getElementById("humidity").textContent =
                    data.humidity + " %";

                document.getElementById("water-moisture").textContent =
                    data.water_moisture + " %";

            } catch (error) {
                console.error(error);

                document.getElementById("temperature").textContent = "Offline";
                document.getElementById("humidity").textContent = "Offline";
                document.getElementById("water-moisture").textContent = "Offline";
            }
        }

        loadSensor();
        setInterval(loadSensor, 3000);
    </script>

</body>
</html>
