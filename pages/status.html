<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerdEX</title>
    <link rel="stylesheet" href="../css/welcome.css"/>
    <style>
        /* Grid design para sa mga Status Cards */
        .status-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 80px;
            margin-top: 20px;
            margin-right: 200px;
        }
        .status-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #fbbf24;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .status-card.warning {
            border-left-color: #60a5fa;
        }
        .status-card h4 {
            margin: 0 0 10px 0;
            color: #555;
        }
        .status-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
       <div class="sidebar">

            <div class="logo">
                <img src="../images/verdexlogo.png" alt="VerdEX Logo">
            </div>

        <a href="home.html">Home</a>
        <a href="inventory.html">Inventory</a>
        <a href="notification.html">Notifications</a>
        <a href="sales.html">Sales</a>
        <a href="status.html" class="active">Status</a> 
        <a href="trends.html">Trends</a>
        <a href="reports.html">Weekly Reports</a>
        
        <h4>About Profile</h4>
        <a href="profile.html">My Profile</a>
        <a href="settings.html">Settings</a>
        <a href="logout.html">Logout</a>
    </div>

    <div class="content">
        <h1>LALA</h1>
        <p>di ko alam ilalagay basta</p>

        <div class="status-container">
            <!-- Card 1 para sa temperature -->
            <div class="status-card">
                <h4>Temperature</h4>
                <div class="status-value" id="temperature">Loading...</div>
            </div>

            <!-- Card 2 para sa humidity -->
            <div class="status-card">
                <h4>Humidity</h4>
                <div class="status-value" id="humidity">Loading...</div>
            </div>

            <!-- Card 3 sa water warning -->
            <div class="status-card warning">
                <h4>Water Moisture</h4>
                <div class="status-value" id="water-moisture">Loading...</div>
            </div>

            <div class="status-card">
                <h4>Notification</h4>
                <div class="status-value" id="humidity">Loading...</div>
        </div>
    </div> 
    <script>
async function loadSensor() {
    try {
        const response = await fetch("sensor.json?" + Date.now());

        if (!response.ok) {
            throw new Error("Unable to load sensor.json");
        }

        const data = await response.json();

        document.getElementById("temperature").textContent =
            data.temperature + " °C";

        document.getElementById("humidity").textContent =
            data.humidity + " %";

        document.getElementById("water-moisture").textContent =
            data.water_moisture + " %";

    } catch (error) {
        console.error(error);

        document.getElementById("temperature").textContent = "Offline";
        document.getElementById("humidity").textContent = "Offline";
        document.getElementById("water-moisture").textContent = "Offline";
    }
}

// Load immediately
loadSensor();

// Refresh every 3 seconds
setInterval(loadSensor, 3000);
</script>

</body>
</html>
